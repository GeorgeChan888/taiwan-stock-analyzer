name: 每日台股更新

on:
  schedule:
    # 台北時間 16:00 = UTC 08:00（台灣無夏令時間）
    - cron: '0 7 * * 1-5'   # 週一到週五
  workflow_dispatch:          # 也可手動觸發

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 執行更新腳本
        run: node update_prices.js

      - name: 提交更新後的 HTML
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add taiwan_stock_analysis.html
          git diff --staged --quiet || git commit -m "每日更新：$(TZ='Asia/Taipei' date '+%Y/%m/%d %H:%M') 台北時間"
          git push
